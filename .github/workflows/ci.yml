name: Face Sequencer Pro CI

on:
  push:
    branches: [main, dredd]
  pull_request:
    branches: [main, dredd]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_audio.txt ]; then pip install -r requirements_audio.txt; fi
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run test suite with coverage (selective)
        run: |
          python -m pytest -q --cov=app.py --cov=enhanced_silence_detector.py --cov=api_responses.py --cov=audio_error_handling.py --cov-report=xml --cov-report=term --cov-fail-under=70 \
            tests/test_api_audio_endpoints.py \
            tests/test_openapi_contract.py \
            tests/test_sequence_schema.py \
            tests/test_enhanced_silence_detector.py

      - name: Prepare coverage artifacts
        run: |
          if [ -f .coverage ]; then mv .coverage .coverage.${{ matrix.python-version }}; fi
          ls -al .coverage* || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage.${{ matrix.python-version }}

  coverage-merge:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Install coverage tool
        run: pip install coverage
      - name: Combine coverage
        run: |
          ls -al
          ls -al .coverage* || true
          coverage combine .coverage.*
          coverage xml
          coverage report -m
      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  fast-api:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install flask pillow numpy scipy pytest pyyaml jsonschema jsonschema[format] coverage
      - name: Assemble modular OpenAPI spec
        run: |
          python build_openapi.py > openapi.yaml
      - name: Run fast schema tests only
        env:
          FAST_TESTS: "1"
        run: pytest tests/test_openapi_strict.py -q
