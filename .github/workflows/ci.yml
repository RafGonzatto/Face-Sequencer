name: Face Sequencer Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_audio.txt ]; then pip install -r requirements_audio.txt; fi
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        run: |
          python -m pytest test_audio_basic.py -v

      - name: Run integration tests
        run: |
          python -m pytest test_audio_integration.py test_sequence_building.py -v

      - name: Run performance tests
        run: |
          python -m pytest test_performance.py -v

      - name: Generate test coverage report
        run: |
          python -m pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  browser-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_audio.txt ]; then pip install -r requirements_audio.txt; fi
          pip install pytest-selenium webdriver-manager

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@latest

      - name: Start Flask server
        run: |
          python app.py &
          sleep 5  # Give the server time to start
        env:
          FLASK_ENV: testing

      - name: Run browser tests with Chrome
        run: |
          python -m pytest test_cross_browser.py -v --driver Chrome

      - name: Run browser tests with Firefox
        run: |
          python -m pytest test_cross_browser.py -v --driver Firefox
