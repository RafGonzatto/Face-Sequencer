openapi: 3.0.3
info:
  title: Face Sequencer Pro API
  version: 0c4d7ee
  description: Modular OpenAPI specification (assembled)
servers:
- url: http://localhost:5000
paths:
  /api/audio/status:
    get:
      summary: Audio alignment system status
      responses:
        '200':
          description: Status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /api/audio/upload:
    post:
      summary: Upload an audio file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload success
        '400':
          description: Validation / upload error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Detected corrupt or invalid audio data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Audio alignment system unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/audio/align:
    post:
      summary: Standard audio alignment
      responses:
        '200':
          description: Alignment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentResponse'
        '400':
          description: Missing/invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Alignment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: System unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/audio/align-enhanced:
    post:
      summary: Enhanced audio alignment
      responses:
        '200':
          description: Enhanced alignment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentResponseEnhanced'
        '400':
          description: Missing/invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Alignment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: System unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/audio/analyze:
    post:
      summary: Analyze audio for silence and speech segments
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          description: Missing/invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: System unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/export/video:
    post:
      summary: Start export task
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    task_id:
                      type: string
        '400':
          description: Invalid sequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Export generation failed (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Export subsystem unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/export/status/{task_id}:
    get:
      summary: Get export status
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatusResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/export/validate/{task_id}:
    get:
      summary: Validate export file
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Validation result
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/models/preload:
    post:
      summary: Preload one or more ML models into memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - models
              properties:
                models:
                  type: array
                  items:
                    type: string
                register:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Alias of known model type (e.g. whisperx_transcribe_tiny)
      responses:
        '200':
          description: Preload status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Model already registered with conflicting type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Memory budget exceeded (too large to load)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected load failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/models/stats:
    get:
      summary: Retrieve model manager statistics
      responses:
        '200':
          description: Manager statistics
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    manager:
                      $ref: '#/components/schemas/ModelManagerStats'
                    success:
                      type: boolean
                    message:
                      type: string
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/models/list:
    get:
      summary: List registered models (lightweight alias of stats)
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    models:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelEntry'
                    loaded:
                      type: integer
                    registered:
                      type: integer
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/models/unload:
    post:
      summary: Unload (release) one or more models from memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - models
              properties:
                models:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Unload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: One or more models not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/project/save:
    post:
      summary: Save project to JSON
      responses:
        '200':
          description: Project JSON file
  /api/project/load:
    post:
      summary: Load project from uploaded file
      responses:
        '200':
          description: Project loaded
  /api/sequence/frame/{frame_id}:
    get:
      summary: Retrieve a single sequence frame preview
      parameters:
      - in: path
        name: frame_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Frame data
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    char:
                      type: string
                    duration:
                      type: integer
                    is_pause:
                      type: boolean
                    image:
                      type: string
                    dimensions:
                      type: array
                      items:
                        type: integer
        '404':
          description: Frame not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sequence/update:
    post:
      summary: Update sequence frame properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceUpdateRequest'
      responses:
        '200':
          description: Frame updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Frame not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sequence/reorder:
    post:
      summary: Reorder sequence frames
      requestBody:
        required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SequenceReorderRequest'
      responses:
        '200':
          description: Sequence reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid reorder payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sequence/delete:
    post:
      summary: Delete a sequence frame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceDeleteRequest'
      responses:
        '200':
          description: Frame deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Invalid delete payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Frame not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sequence/build-from-audio:
    post:
      summary: Build sequence frames based on alignment tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceBuildFromAudioRequest'
      responses:
        '200':
          description: Sequence constructed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    sequence:
                      type: array
                      items:
                        $ref: '#/components/schemas/SequenceFrame'
                    stats:
                      type: object
        '400':
          description: Invalid build request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Alignment / token mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/templates:
    get:
      summary: List templates
      responses:
        '200':
          description: Templates list
components:
  schemas:
    StandardResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        error_type:
          type: string
        details:
          type: object
        recommendations:
          type: array
          items:
            type: string
        lifecycle_stage:
          type: string
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - type: object
        required:
        - success
        - error
        properties:
          success:
            const: false
          error:
            type: string
          error_type:
            type: string
          details:
            type: object
          recommendations:
            type: array
            items:
              type: string
          lifecycle_stage:
            type: string
    AlignmentToken:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        viseme:
          type: string
        start_ms:
          type: number
        end_ms:
          type: number
        duration_ms:
          type: number
        confidence:
          type: number
    AlignmentResult:
      type: object
      properties:
        language:
          type: string
        sample_rate:
          type: integer
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/AlignmentToken'
        stats:
          type: object
    AlignmentResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - type: object
        properties:
          alignment:
            $ref: '#/components/schemas/AlignmentResult'
          sequence:
            type: array
            items:
              $ref: '#/components/schemas/AlignmentToken'
          stats:
            type: object
          cached:
            type: boolean
    AlignmentResponseEnhanced:
      allOf:
      - $ref: '#/components/schemas/AlignmentResponse'
      - type: object
        properties:
          frame_states:
            type: array
            items:
              type: object
          timeline:
            type: array
            items:
              type: object
    AnalysisResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - type: object
        properties:
          analysis:
            type: object
          stats:
            type: object
    ModelEntry:
      type: object
      properties:
        name:
          type: string
        loaded:
          type: boolean
        size_bytes:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
        load_time_s:
          type: number
          nullable: true
        last_access:
          type: number
        error:
          type: string
          nullable: true
    ModelManagerStats:
      type: object
      properties:
        max_memory_bytes:
          type: integer
        current_memory_bytes:
          type: integer
        registered_models:
          type: integer
        loaded_models:
          type: integer
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelEntry'
    ExportTask:
      type: object
      required:
      - status
      - progress
      properties:
        status:
          type: string
        progress:
          type: integer
        filename:
          type: string
        path:
          type: string
        error:
          type: string
          nullable: true
        message:
          type: string
    ExportStatusResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - type: object
        properties:
          task:
            $ref: '#/components/schemas/ExportTask'
    Project:
      type: object
      properties:
        name:
          type: string
        folder_path:
          type: string
        fallback_image:
          type: string
        text:
          type: string
        settings:
          type: object
    SequenceFrame:
      type: object
      properties:
        char:
          type: string
        img:
          type: string
          nullable: true
        ms:
          type: integer
        audio_start:
          type: number
        audio_end:
          type: number
        source:
          type: string
    Marker:
      type: object
      properties:
        text:
          type: string
        position:
          type: number
        time_ms:
          type: number
    SequenceUpdateRequest:
      type: object
      required:
      - frame_id
      - updates
      properties:
        frame_id:
          type: integer
          minimum: 0
        updates:
          type: object
          properties:
            duration:
              type: integer
              minimum: 1
    SequenceReorderRequest:
      type: object
      required:
      - from_index
      - to_index
      properties:
        from_index:
          type: integer
          minimum: 0
        to_index:
          type: integer
          minimum: 0
    SequenceDeleteRequest:
      type: object
      required:
      - frame_id
      properties:
        frame_id:
          type: integer
          minimum: 0
    SequenceBuildFromAudioRequest:
      type: object
      required:
      - audio_filename
      - text
      - alignment_tokens
      properties:
        audio_filename:
          type: string
        text:
          type: string
        alignment_tokens:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
              viseme:
                type: string
              start_ms:
                type: number
              end_ms:
                type: number
              duration_ms:
                type: number
