# Audio related paths
/api/audio/status:
  get:
    tags: [audio]
    summary: Audio alignment system status
    responses:
      "200":
        description: Status payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardResponse"

/api/audio/upload:
  post:
    tags: [audio]
    summary: Upload an audio file
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              audio:
                type: string
                format: binary
    responses:
      "200": { description: Upload success }
      "400":
        description: Validation / upload error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "415":
        description: Unsupported media type
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "422":
        description: Detected corrupt or invalid audio data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "503":
        description: Audio alignment system unavailable
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "500":
        description: Unexpected server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/audio/align:
  post:
    tags: [audio]
    summary: Standard audio alignment
    responses:
      "200":
        description: Alignment result
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlignmentResponse"
      "400":
        {
          description: Missing/invalid request body,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "422":
        {
          description: Alignment failed,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "503":
        {
          description: System unavailable,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "500":
        {
          description: Unexpected error,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }

