# Export related paths
/api/export/video:
  post:
    tags: [export]
    summary: Start export task
    responses:
      "200":
        description: Task started
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StandardResponse"
                - type: object
                  properties:
                    task_id: { type: string }
      "400":
        {
          description: Invalid sequence,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "422":
        {
          description: Export generation failed (validation),
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "503":
        {
          description: Export subsystem unavailable,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "500":
        {
          description: Unexpected error,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
/api/export/status/{task_id}:
  get:
    tags: [export]
    summary: Get export status
    parameters:
      - in: path
        name: task_id
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Export status
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportStatusResponse"
      "404":
        {
          description: Task not found,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "500":
        {
          description: Unexpected error,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
/api/export/validate/{task_id}:
  get:
    tags: [export]
    summary: Validate export file
    parameters:
      - in: path
        name: task_id
        required: true
        schema: { type: string }
    responses:
      "200": { description: Validation result }
      "404":
        {
          description: Task not found,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
      "500":
        {
          description: Unexpected error,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ErrorResponse" } },
            },
        }
